<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="Reviews · Pizza Omakase">
<meta property="og:image" content="https://pizzaomakase.co.il/images/originals/round-margherita-leopard.jpg">
<title>Reviews · Pizza Omakase</title>
<meta name="description" content="What guests say about Pizza Omakase, a chef's-choice New York–style pizza tasting in Israel. Been to an evening? Leave a review.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pizza Omakase">
<meta property="og:description" content="What guests say about Pizza Omakase, a chef's-choice New York–style pizza tasting in Israel. Been to an evening? Leave a review.">
<meta property="og:url" content="https://pizzaomakase.co.il/reviews.html">
<meta property="og:locale" content="en_IL">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#B5321F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: reviews page — heading + Google button, approved guest reviews in a two-column grid, then the leave-a-review form.
   Palette: basil-ink on a cool flour-dusted marble, crust gold for warmth, tomato reserved for actions. */
:root{
  --bg:#F3F2EE;
  --surface:#FFFFFF;
  --ink:#18221C;
  --muted:#5B655E;
  --line:#D9DAD3;
  --crust:#B9852F;
  --tomato:#B5321F;
  --tomato-ink:#FFFFFF;
  --basil:#2F5A3B;
  --soft:#E8E7E0;
  --display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121714; --surface:#1A211C; --ink:#ECEDE7; --muted:#A3ABA4; --line:#2E3832;
    --crust:#D9A84E; --tomato:#E0553C; --tomato-ink:#160C09; --basil:#7FB28C; --soft:#212A24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121714; --surface:#1A211C; --ink:#ECEDE7; --muted:#A3ABA4; --line:#2E3832;
  --crust:#D9A84E; --tomato:#E0553C; --tomato-ink:#160C09; --basil:#7FB28C; --soft:#212A24;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:clamp(2rem,4.6vw,3.2rem);font-weight:800}
h3{font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--crust)}
.lede{font-size:1.3rem;color:var(--muted);max-width:42ch;line-height:1.45}
.copy .lede:first-of-type{color:var(--ink)}
:focus-visible{outline:2px solid var(--tomato);outline-offset:3px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.mark{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:baseline;gap:8px}
.mark small{font-family:var(--mono);font-weight:400;font-size:.68rem;color:var(--muted);letter-spacing:.08em}
nav.links{display:flex;gap:20px;font-family:var(--display);font-weight:500;font-size:.95rem}
nav.links a{text-decoration:none;color:var(--muted)}
nav.links a:hover,nav.links a[aria-current]{color:var(--ink)}
nav.links a,.mark{white-space:nowrap}
@media (max-width:760px){nav.links .opt{display:none}}
@media (max-width:480px){nav.links{gap:12px;font-size:.85rem}.mark{font-size:1rem}header.top .wrap{gap:10px}}

.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1rem;padding:13px 22px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer;transition:transform .15s ease, background .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--tomato);border-color:var(--tomato);color:var(--tomato-ink)}
.btn.small{padding:8px 16px;font-size:.9rem}

/* hero */
.hero{padding-block:clamp(40px,7vw,88px) clamp(40px,6vw,72px)}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,5vw,64px);align-items:center}
.hero h1{font-size:clamp(3.4rem,10vw,7.4rem);font-weight:800;letter-spacing:-.045em}
.hero h1 em{font-style:normal;color:var(--tomato)}
.hero .copy{display:flex;flex-direction:column;gap:24px;min-width:0}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px}
.hero figure{margin:0;position:relative}
.hero figure img{display:block;width:100%;height:auto;filter:drop-shadow(0 24px 30px rgba(0,0,0,.35))}
.hero figure figcaption{position:absolute;left:-6px;bottom:8%;background:var(--surface);border:1px solid var(--line);padding:10px 14px;border-radius:var(--radius);font-family:var(--mono);font-size:.78rem;color:var(--muted);max-width:75%}
.hero figure figcaption b{display:block;font-family:var(--display);font-size:1rem;color:var(--ink);font-weight:700}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.hero figure{max-width:440px;justify-self:center;width:100%}}

section{padding-block:clamp(56px,8vw,96px)}
section.alt{background:var(--soft)}
.sec-head{display:flex;flex-direction:column;gap:14px;margin-bottom:clamp(28px,4vw,44px)}
.fine{font-size:.92rem;color:var(--muted)}

/* tasting card */
.about{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,64px);align-items:start}
.about .text{display:flex;flex-direction:column;gap:18px;min-width:0}
.card-menu{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(22px,3vw,34px);display:flex;flex-direction:column;gap:6px}
.card-menu .head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:6px;gap:12px}
.card-menu .head h3{font-size:1.5rem}
.card-menu .head span{font-family:var(--mono);font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.course{display:grid;grid-template-columns:3.2ch 1fr;gap:14px;padding-block:11px;border-bottom:1px dashed var(--line)}
.course:last-of-type{border-bottom:0}
.course .n{font-family:var(--mono);font-size:.85rem;color:var(--crust);padding-top:3px;font-variant-numeric:tabular-nums}
.course b{font-family:var(--display);font-weight:700;font-size:1.05rem;display:block}
.course small{color:var(--muted);font-size:.95rem}
.course.pie b{color:var(--ink)}
.card-menu .foot{margin-top:10px;padding-top:12px;border-top:2px solid var(--ink);font-family:var(--mono);font-size:.8rem;color:var(--basil);display:flex;gap:8px;align-items:center}
@media (max-width:820px){.about{grid-template-columns:1fr}}

/* gallery */
.includes-card{background:#18221C;color:#F3F2EE;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px 24px;max-width:26rem}
.includes-card .label{font-family:var(--mono);font-size:1rem;letter-spacing:.14em;text-transform:uppercase;color:#D9A84E;margin-bottom:12px}
.includes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-family:var(--body);font-weight:400;font-size:1.25rem}
.includes li{display:flex;align-items:center;gap:12px}
.includes li::before{content:"";width:10px;height:10px;border-radius:50%;background:#E0553C;flex:none}
.pies{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,4vw,56px);max-width:1040px;margin-inline:auto;align-items:end}
.pies figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.pies figcaption{font-family:var(--display);font-weight:700;font-size:1.15rem;text-align:center}
@media (max-width:700px){.pies{grid-template-columns:1fr;max-width:380px}}
.pies img{width:100%;height:auto;display:block;min-width:0;filter:drop-shadow(0 20px 24px rgba(0,0,0,.3))}
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,5vw,64px);align-items:center}
.about-copy{display:flex;flex-direction:column;gap:18px;min-width:0}
.about-copy p{font-size:1.15rem;max-width:52ch}
.about-copy .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.about-photo{margin:0}
.about-photo img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:50% 25%;border-radius:var(--radius);display:block}
@media (max-width:820px){.about-grid{grid-template-columns:1fr}.about-photo{max-width:440px}}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.gallery img{min-width:0}
.form-title{font-size:2rem}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.gallery img{width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;border-radius:var(--radius);display:block}
.gallery figcaption{font-family:var(--display);font-weight:600;font-size:1rem}
.gallery figcaption span{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:.92rem}
@media (max-width:900px){.gallery{grid-template-columns:repeat(2,1fr)}}

/* evenings */
.notice{font-family:var(--mono);font-size:.82rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:18px}
.events{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.event{display:grid;grid-template-columns:92px 1fr auto;gap:clamp(14px,3vw,32px);align-items:center;padding-block:22px;border-bottom:1px solid var(--line)}
.date{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.date .dow{font-family:var(--mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.date .day{font-family:var(--display);font-weight:800;font-size:2.6rem;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.date .mon{font-family:var(--mono);font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--crust)}
.event .info{display:flex;flex-direction:column;gap:4px;min-width:0}
.event .info h3{font-size:1.25rem}
.event .meta{color:var(--muted);font-size:.98rem}
.pill{display:inline-block;font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.pill.open{color:var(--basil)}
.pill.few{color:var(--crust)}
.pill.full{color:var(--muted)}
.event .act{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.empty{padding:28px 0;color:var(--muted)}
@media (max-width:640px){.event{grid-template-columns:64px 1fr}.event .act{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}.date .day{font-size:2.1rem}}

/* forms */
.forms{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,48px);align-items:start}
@media (max-width:900px){.forms{grid-template-columns:1fr}}
form.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(22px,3vw,34px);display:flex;flex-direction:column;gap:16px;min-width:0}
form.panel .ph{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
form.panel .ph p{color:var(--muted);font-size:1rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
label{font-family:var(--display);font-weight:600;font-size:.92rem}
label .opt{font-family:var(--body);font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;width:100%}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--basil);outline-offset:0;border-color:transparent}
.status{font-size:.98rem;padding:12px 14px;border-radius:var(--radius);background:var(--soft)}
.status.ok{border-left:3px solid var(--basil)}
.status.err{border-left:3px solid var(--tomato)}
.hp{position:absolute;left:-9999px}

/* faq */
.faq{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,3vw,40px)}
.faq div{display:flex;flex-direction:column;gap:8px;min-width:0}
.faq p{color:var(--muted);font-size:1rem}
@media (max-width:820px){.faq{grid-template-columns:1fr}}

footer{border-top:1px solid var(--line);padding-block:32px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}

@media (max-width:560px){header.top .wrap{flex-wrap:wrap;row-gap:6px}nav.links{width:100%;justify-content:space-between;gap:8px}}

/* reviews page */
[hidden]{display:none!important}
.rv-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:20px;margin-bottom:clamp(28px,4vw,44px)}
.rv-head .copy{display:flex;flex-direction:column;gap:12px;min-width:0}
.rv-head h1{font-size:clamp(2.8rem,8vw,5.2rem);font-weight:800;letter-spacing:-.04em}
.rv-head h1 em{font-style:normal;color:var(--tomato)}
.reviews{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(16px,3vw,28px)}
@media (max-width:760px){.reviews{grid-template-columns:1fr}}
.review{margin:0;padding:clamp(20px,3vw,28px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;gap:12px;min-width:0}
.review blockquote{margin:0;font-size:1.08rem;line-height:1.55}
.review figcaption{font-family:var(--display);font-weight:600;font-size:.95rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.review figcaption span{font-family:var(--mono);font-weight:400;font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.stars{color:var(--crust);letter-spacing:.12em;font-size:1.05rem}
.stars .off{color:var(--line)}
.reviews .empty{grid-column:1/-1;padding:28px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);text-align:center}
.review-form{max-width:640px;margin-inline:auto}
fieldset.rating{border:0;margin:0;padding:0;min-width:0}
fieldset.rating legend{font-family:var(--display);font-weight:600;font-size:.92rem;padding:0;margin-bottom:6px}
.rate{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px}
.rate input{position:absolute;opacity:0;width:1px;height:1px}
.rate label{font-size:2.1rem;line-height:1;color:var(--line);cursor:pointer;font-family:var(--body)}
.rate input:checked ~ label,.rate label:hover,.rate label:hover ~ label{color:var(--crust)}
.rate input:focus-visible + label{outline:2px solid var(--tomato);outline-offset:2px;border-radius:4px}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="mark" href="./">Pizza Omakase</a>
    <nav class="links" aria-label="Main">
      <a href="./#about">About</a>
      <a href="./#dates">Dates</a>
      <a href="private-events.html">Private events</a>
      <a href="workshops.html">Workshops</a>
      <a href="reviews.html" aria-current="page">Reviews</a>
    </nav>
  </div>
</header>

<main>
  <section>
    <div class="wrap">
      <div class="rv-head">
        <div class="copy">
          <p class="eyebrow">From our guests</p>
          <h1>Reviews</h1>
        </div>
        <a class="btn" id="googleReview" href="#" target="_blank" rel="noopener" hidden>Review us on Google</a>
      </div>
      <div class="reviews" id="reviewsList" aria-live="polite">
        <p class="empty">Loading reviews…</p>
      </div>
    </div>
  </section>

  <section class="alt" id="leave-review">
    <div class="wrap">
      <form class="panel review-form" id="reviewForm" novalidate>
        <h2 class="form-title">Leave a review</h2>
        <div class="row">
          <div class="field"><label for="v-name">Name</label><input id="v-name" name="name" autocomplete="name" required></div>
          <div class="field"><label for="v-when">Evening <span class="opt">(optional)</span></label><input id="v-when" name="evening" placeholder="e.g. 14 Oct, Jaffa"></div>
        </div>
        <fieldset class="rating">
          <legend>Rating</legend>
          <div class="rate">
            <input type="radio" id="v-r5" name="rating" value="5" required><label for="v-r5" title="5 stars">★</label>
            <input type="radio" id="v-r4" name="rating" value="4"><label for="v-r4" title="4 stars">★</label>
            <input type="radio" id="v-r3" name="rating" value="3"><label for="v-r3" title="3 stars">★</label>
            <input type="radio" id="v-r2" name="rating" value="2"><label for="v-r2" title="2 stars">★</label>
            <input type="radio" id="v-r1" name="rating" value="1"><label for="v-r1" title="1 star">★</label>
          </div>
        </fieldset>
        <div class="field">
          <label for="v-text">Your review</label>
          <textarea id="v-text" name="review" required></textarea>
        </div>
        <input class="hp" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn primary" type="submit">Send review</button>
        <p class="status" role="status" hidden></p>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>pizzaomakase.co.il</span>
  </div>
</footer>

<script>
/* ===================== SETTINGS =====================
   REVIEWS_CSV_URL:   a "Reviews" tab in your Google Sheet, published as CSV
                      (File → Share → Publish to web → choose the tab → CSV).
                      Columns: name | date | rating | review | approved
                      Only rows with approved = yes appear here.
   GOOGLE_REVIEW_URL: the "Ask for reviews" link from your Google Business Profile.
                      Leave "" to hide the "Review us on Google" button.
   New reviews from the form below are emailed to you through Web3Forms.
====================================================== */
const REVIEWS_CSV_URL   = "";
const GOOGLE_REVIEW_URL = "";
const WEB3FORMS_KEY     = "0ec3b494-e699-4ae4-8686-b59944bfb0a0";

function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cell);cell=""}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cell);rows.push(row);row=[];cell="" }
    else cell+=c;
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row)}
  const head=(rows.shift()||[]).map(h=>h.trim().toLowerCase().replace(/\s+/g,"_"));
  return rows.filter(r=>r.some(v=>v.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])));
}

async function loadReviews(){
  const list=document.getElementById("reviewsList");
  const g=document.getElementById("googleReview");
  if(GOOGLE_REVIEW_URL){g.href=GOOGLE_REVIEW_URL;g.hidden=false}
  let rows=[];
  if(REVIEWS_CSV_URL){
    try{const res=await fetch(REVIEWS_CSV_URL,{cache:"no-store"});if(res.ok) rows=parseCSV(await res.text())}catch(e){}
  }
  const shown=rows.filter(r=>/^(yes|y|true|1)$/i.test(r.approved||"")&&r.review).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  list.textContent="";
  if(!shown.length){
    const p=document.createElement("p");p.className="empty";
    p.textContent="No reviews yet. Been to an evening? Be the first to leave one.";
    list.appendChild(p);return;
  }
  for(const r of shown){
    const f=document.createElement("figure");f.className="review";
    const n=Math.max(0,Math.min(5,parseInt(r.rating,10)||0));
    if(n){
      const st=document.createElement("div");st.className="stars";st.setAttribute("aria-label",n+" out of 5 stars");
      st.textContent="★".repeat(n);const off=document.createElement("span");off.className="off";off.textContent="★".repeat(5-n);st.appendChild(off);
      f.appendChild(st);
    }
    const q=document.createElement("blockquote");q.textContent=r.review;
    const c=document.createElement("figcaption");c.textContent=r.name||"Guest";
    if(r.date){const d=new Date(r.date+"T12:00:00");if(!isNaN(d)){const s=document.createElement("span");s.textContent=d.toLocaleDateString("en-GB",{month:"short",year:"numeric"});c.appendChild(s)}}
    f.append(q,c);list.appendChild(f);
  }
}

const form=document.getElementById("reviewForm");
const status=form.querySelector(".status"), btn=form.querySelector("button[type=submit]");
form.addEventListener("submit",async ev=>{
  ev.preventDefault();
  const fail=(msg,el)=>{status.hidden=false;status.className="status err";status.textContent=msg;if(el)el.focus()};
  const nameEl=document.getElementById("v-name"), textEl=document.getElementById("v-text");
  if(!nameEl.value.trim()) return fail('Please fill in "Name" before sending.',nameEl);
  if(!form.querySelector('input[name="rating"]:checked')) return fail('Please choose a star rating before sending.',document.getElementById("v-r5"));
  if(!textEl.value.trim()) return fail('Please write your review before sending.',textEl);
  btn.disabled=true;btn.textContent="Sending…";
  try{
    const data=new FormData(form);
    data.append("access_key",WEB3FORMS_KEY);
    data.append("subject","Pizza Omakase · new review ("+data.get("rating")+"★)");
    data.append("from_name","Pizza Omakase website");
    const res=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{Accept:"application/json"},body:data});
    if(!res.ok) throw new Error(res.status);
    form.reset();
    status.hidden=false;status.className="status ok";status.textContent="Thank you! Your review will appear here once it's approved.";
  }catch(e){
    fail("Didn't go through. Please try again.");
  }finally{
    btn.disabled=false;btn.textContent="Send review";
  }
});
loadReviews();
</script>
</body>
</html>
