<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="t">
  <title id="t">Cartoon of the chef stretching pizza dough</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#F7E6CC"/>
      <stop offset="1" stop-color="#EBCFA6"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="400" height="500" rx="18" fill="url(#bg)"/>
  <circle cx="200" cy="320" r="150" fill="#B5321F" opacity=".1"/>

  <!-- flour puffs -->
  <g fill="#fff" opacity=".9">
    <circle cx="66" cy="44" r="5"/><circle cx="82" cy="30" r="3"/><circle cx="336" cy="40" r="4"/>
    <circle cx="350" cy="58" r="2.5"/><circle cx="54" cy="70" r="2.5"/><circle cx="322" cy="22" r="2"/>
  </g>

  <!-- spin lines -->
  <g fill="none" stroke="#18221C" stroke-width="3" stroke-linecap="round" opacity=".5">
    <path d="M60 64 q-14 22 4 42"/><path d="M340 64 q14 22 -4 42"/>
    <path d="M44 78 q-8 16 2 28"/><path d="M356 78 q8 16 -2 28"/>
  </g>

  <!-- ARMS: outline, skin, then rolled sleeve (drawn as thick strokes so they bend naturally) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- outlines -->
    <path d="M150 372 C112 350 92 300 96 252 C99 206 116 160 142 116" stroke="#18221C" stroke-width="40"/>
    <path d="M250 372 C288 350 308 300 304 252 C301 206 284 160 258 116" stroke="#18221C" stroke-width="40"/>
    <!-- skin (forearms) -->
    <path d="M150 372 C112 350 92 300 96 252 C99 206 116 160 142 116" stroke="#E7B088" stroke-width="33"/>
    <path d="M250 372 C288 350 308 300 304 252 C301 206 284 160 258 116" stroke="#E7B088" stroke-width="33"/>
    <!-- white sleeves up past the elbow -->
    <path d="M150 372 C112 350 92 300 96 248" stroke="#fff" stroke-width="33"/>
    <path d="M250 372 C288 350 308 300 304 248" stroke="#fff" stroke-width="33"/>
  </g>
  <!-- rolled cuffs -->
  <g stroke="#18221C" stroke-width="3" fill="#fff" stroke-linejoin="round">
    <path d="M76 240 q20 -8 40 0 l-2 14 q-18 -6 -36 0 z"/>
    <path d="M324 240 q-20 -8 -40 0 l2 14 q18 -6 36 0 z"/>
  </g>
  <!-- forearm hair hint -->
  <g stroke="#B97E57" stroke-width="2" stroke-linecap="round" opacity=".6">
    <path d="M108 200 l6 -3"/><path d="M114 182 l6 -3"/><path d="M292 200 l-6 -3"/><path d="M286 182 l-6 -3"/>
  </g>

  <!-- hands (fingers spread under the dough) -->
  <g stroke="#18221C" stroke-width="3.5" fill="#E7B088" stroke-linejoin="round">
    <path d="M124 118 q-6 -16 6 -24 q14 -8 30 -2 q12 6 6 18 q-6 12 -22 14 q-16 2 -20 -6 z"/>
    <path d="M276 118 q6 -16 -6 -24 q-14 -8 -30 -2 q-12 6 -6 18 q6 12 22 14 q16 2 20 -6 z"/>
  </g>

  <!-- PIZZA -->
  <g stroke="#18221C" stroke-width="3.5">
    <!-- crust -->
    <ellipse cx="200" cy="78" rx="126" ry="36" fill="#E3AE68"/>
    <!-- sauce -->
    <ellipse cx="200" cy="74" rx="104" ry="26" fill="#C8361F" stroke-width="2.5"/>
  </g>
  <!-- leopard char spots on crust -->
  <g fill="#5A2E14" opacity=".85">
    <ellipse cx="96" cy="86" rx="7" ry="4"/><ellipse cx="128" cy="104" rx="6" ry="3.5"/><ellipse cx="190" cy="112" rx="8" ry="3.5"/>
    <ellipse cx="262" cy="108" rx="6" ry="3.5"/><ellipse cx="306" cy="88" rx="7" ry="4"/><ellipse cx="300" cy="58" rx="5" ry="3"/>
    <ellipse cx="236" cy="44" rx="6" ry="3"/><ellipse cx="150" cy="46" rx="6" ry="3"/><ellipse cx="94" cy="64" rx="4" ry="3"/>
  </g>
  <!-- mozzarella -->
  <g fill="#FFF8EA" stroke="#E9DCC0" stroke-width="1.5">
    <ellipse cx="160" cy="68" rx="16" ry="7"/><ellipse cx="226" cy="64" rx="15" ry="6.5"/>
    <ellipse cx="196" cy="86" rx="17" ry="7"/><ellipse cx="128" cy="82" rx="12" ry="5.5"/>
    <ellipse cx="268" cy="82" rx="13" ry="6"/>
  </g>
  <!-- basil -->
  <g fill="#3E7B3A" stroke="#234A22" stroke-width="1.5">
    <path d="M186 62 q10 -10 22 -2 q-10 10 -22 2 z"/>
    <path d="M144 88 q8 -10 20 -4 q-8 10 -20 4 z"/>
    <path d="M244 78 q10 -8 20 0 q-10 8 -20 0 z"/>
    <path d="M210 92 q8 -6 16 0 q-8 6 -16 0 z"/>
  </g>
  <!-- sauce shine -->
  <path d="M118 66 q20 -14 52 -16" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>

  <!-- BODY: chef jacket with rounded shoulders -->
  <g stroke="#18221C" stroke-width="3.5" stroke-linejoin="round">
    <path d="M108 500 C106 436 120 392 152 368 C170 356 186 348 200 348 C214 348 230 356 248 368 C280 392 294 436 292 500 Z" fill="#fff"/>
    <!-- apron -->
    <path d="M168 392 L232 392 L242 500 L158 500 Z" fill="#F6F4EF"/>
    <path d="M168 392 L184 352 M232 392 L216 352" fill="none"/>
    <!-- apron pocket -->
    <path d="M178 440 h44 v30 q-22 9 -44 0 z" fill="#ECE8DF"/>
  </g>
  <!-- shoulder seams -->
  <g fill="none" stroke="#18221C" stroke-width="2" opacity=".35" stroke-linecap="round">
    <path d="M138 382 q6 26 4 58"/><path d="M262 382 q-6 26 -4 58"/>
  </g>
  <!-- buttons -->
  <g fill="#18221C">
    <circle cx="146" cy="412" r="3.5"/><circle cx="148" cy="442" r="3.5"/>
    <circle cx="254" cy="412" r="3.5"/><circle cx="252" cy="442" r="3.5"/>
  </g>
  <!-- tomato on pocket -->
  <circle cx="200" cy="454" r="7" fill="#B5321F"/>
  <path d="M196 447 l4 3 l4 -3" stroke="#2F5A3B" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- neck + collar -->
  <path d="M184 304 L184 330 Q200 340 216 330 L216 304 Z" fill="#DDA27A" stroke="#18221C" stroke-width="3.5"/>
  <path d="M170 334 L200 358 L230 334 L224 322 Q200 334 176 322 Z" fill="#fff" stroke="#18221C" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- HEAD -->
  <g stroke="#18221C" stroke-width="3.5" stroke-linejoin="round">
    <ellipse cx="148" cy="252" rx="11" ry="16" fill="#E7B088"/>
    <ellipse cx="252" cy="252" rx="11" ry="16" fill="#E7B088"/>
    <path d="M152 234 C152 190 248 190 248 234 L248 264 C248 300 226 320 200 320 C174 320 152 300 152 264 Z" fill="#E7B088"/>
  </g>
  <!-- trimmed beard: short and close to the jaw -->
  <path d="M151 248 C151 300 172 324 200 324 C228 324 249 300 249 248 C245 270 236 284 220 288 C210 284 190 284 180 288 C164 284 155 270 151 248 Z" fill="#3A2A20" stroke="#18221C" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- stubble on cheeks -->
  <g fill="#3A2A20" opacity=".25">
    <circle cx="164" cy="262" r="1.5"/><circle cx="170" cy="268" r="1.5"/><circle cx="160" cy="256" r="1.3"/>
    <circle cx="236" cy="262" r="1.5"/><circle cx="230" cy="268" r="1.5"/><circle cx="240" cy="256" r="1.3"/>
  </g>
  <!-- moustache -->
  <path d="M180 279 C188 272 196 275 200 278 C204 275 212 272 220 279 C212 284 206 283 200 281 C194 283 188 284 180 279 Z" fill="#2B1D16"/>
  <!-- smile -->
  <path d="M187 292 q13 9 26 0" fill="#fff" stroke="#18221C" stroke-width="3" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M200 240 C196 254 188 262 192 270 C196 276 206 276 210 270" fill="#DDA27A" stroke="#18221C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- eyes looking up at the pizza -->
  <g stroke="#18221C" stroke-width="3">
    <ellipse cx="178" cy="240" rx="13" ry="11" fill="#fff"/>
    <ellipse cx="222" cy="240" rx="13" ry="11" fill="#fff"/>
  </g>
  <circle cx="180" cy="235" r="6" fill="#6E7F3E"/><circle cx="224" cy="235" r="6" fill="#6E7F3E"/>
  <circle cx="180" cy="234" r="3" fill="#18221C"/><circle cx="224" cy="234" r="3" fill="#18221C"/>
  <circle cx="182" cy="232" r="1.4" fill="#fff"/><circle cx="226" cy="232" r="1.4" fill="#fff"/>
  <path d="M162 222 q14 -10 30 -2" fill="none" stroke="#2B1D16" stroke-width="6" stroke-linecap="round"/>
  <path d="M208 220 q16 -8 30 4" fill="none" stroke="#2B1D16" stroke-width="6" stroke-linecap="round"/>

  <!-- curly hair -->
  <g fill="#2B1D16" stroke="#18221C" stroke-width="3">
    <circle cx="152" cy="216" r="17"/><circle cx="248" cy="216" r="17"/>
    <circle cx="148" cy="194" r="21"/><circle cx="252" cy="194" r="21"/>
    <circle cx="166" cy="170" r="23"/><circle cx="234" cy="170" r="23"/>
    <circle cx="190" cy="158" r="25"/><circle cx="214" cy="157" r="24"/>
    <circle cx="200" cy="180" r="25"/><circle cx="174" cy="194" r="17"/><circle cx="226" cy="194" r="17"/>
  </g>
  <g fill="none" stroke="#5A4232" stroke-width="2.5" stroke-linecap="round">
    <path d="M182 154 q8 -8 16 0"/><path d="M208 150 q8 -8 16 0"/><path d="M154 190 q6 -8 14 -2"/>
    <path d="M236 190 q8 -6 14 2"/><path d="M190 180 q8 -8 18 0"/><path d="M160 168 q6 -8 14 -2"/>
    <path d="M228 166 q8 -6 14 2"/>
  </g>
  <path d="M196 200 q-10 8 -2 18 q8 6 12 -2" fill="none" stroke="#2B1D16" stroke-width="5" stroke-linecap="round"/>
</svg>
